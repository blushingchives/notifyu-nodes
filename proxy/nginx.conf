worker_processes auto;

events {
  worker_connections 4096;
}

http {
  resolver 127.0.0.11  valid=30s;   # Docker's DNS server
  
  server {
    listen 80;
    server_name ~^rpc-thorchain\.notifyu\.tech$;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-NginX-Proxy true;

      proxy_pass http://notifyu-node-load-balancer-1:11111;
    }
  }
  server {
    listen 80;
    server_name ~^lcd-thorchain\.notifyu\.tech$;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-NginX-Proxy true;

      proxy_pass http://notifyu-node-load-balancer-1:11112;
    }
  }
}