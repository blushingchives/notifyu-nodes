defaults
  log global
  mode tcp
  timeout client 10s
  timeout connect 5s
  timeout server 10s
  timeout tunnel 10m
  timeout client-fin 1s
  timeout server-fin 1s

global
  tune.bufsize 31112768

frontend rpc-fe
  bind :11111
  use_backend rpc-be

backend rpc-be
  option httpchk
  http-check send meth GET uri /status hdr Host host
  http-check expect string catching_up
  http-check expect string false

  balance roundrobin
  server rpc1 thornode-mainnet-rpc.bryanlabs.net:80 check
  server rpc2 thornode-mainnet-rpc.bryanlabs.net:80 check
  server rpc3 thornode-mainnet-rpc.bryanlabs.net:80 check

frontend lcd-fe
  bind :11112
  use_backend lcd-be

backend lcd-be
  option httpchk
  http-check send meth GET uri /cosmos/base/tendermint/v1beta1/syncing hdr Host host
  http-check expect string syncing
  http-check expect string false

  balance roundrobin
  server lcd1 thornode-mainnet-api.bryanlabs.net:80 check
  server lcd2 thornode-mainnet-api.bryanlabs.net:80 check
  server lcd3 thornode-mainnet-api.bryanlabs.net:80 check
